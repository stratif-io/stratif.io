name: Marketplace Scaling (Airbnb)
description: >
  Airbnb's growth from a scrappy YC startup (2010) to a travel marketplace
  hosting over 1 billion guest arrivals lifetime. The growth arc: 700K nights booked
  in mid-2010, 1M by February 2011, unicorn status ($1B valuation) in July 2011.
  Strong summer travel seasonality (June–August dominates) with a secondary December
  holiday travel peak. COVID wiped bookings to near-zero in March 2020, then the IPO
  in December 2020 marked a historic recovery.
axes:
  growth: hockey_stick
  stickiness: normal
  engagement_depth: shallow
  virality: moderate
  scale: large
  noise: explicit
  daily_pattern: always_on
  weekly_pattern: weekends_heavy
  monthly_seasonality: summer_peak

scale_config:
  total_users: 1500000000
  start_date: "2010-01-01"
  end_date: "2026-04-28"

events:
  - type: product_launch
    name: series_a_72m_greylock_sequoia
    start_date: "2010-11-01"
    end_date: "2010-11-15"
    effect:
      arrivals: 2.0

  - type: marketing_campaign
    name: one_million_nights_booked
    start_date: "2011-02-01"
    end_date: "2011-02-08"
    effect:
      arrivals: 1.5

  - type: marketing_campaign
    name: series_b_1b_valuation_unicorn
    start_date: "2011-07-25"
    end_date: "2011-08-24"
    effect:
      arrivals: 3.0

  - type: marketing_campaign
    name: ten_million_nights_milestone
    start_date: "2012-06-01"
    end_date: "2012-06-15"
    effect:
      arrivals: 1.3

  - type: external_shock
    name: covid19_bookings_collapse
    start_date: "2020-03-15"
    end_date: "2020-06-13"
    effect:
      arrivals: 0.1

  - type: product_launch
    name: ipo_nasdaq_record_consumer_interest
    start_date: "2020-12-10"
    end_date: "2021-01-09"
    effect:
      arrivals: 2.5

markov:
  events:
    - name: PageView
    - name: ProductViewed
    - name: AddToCart
    - name: CheckoutStarted
    - name: PurchaseCompleted
  start:
    PageView: 1.0
  transitions:
    PageView:
      ProductViewed: 0.60
      "[end]": 0.40
    ProductViewed:
      AddToCart: 0.25
      ProductViewed: 0.35
      "[end]": 0.40
    AddToCart:
      CheckoutStarted: 0.65
      "[end]": 0.35
    CheckoutStarted:
      PurchaseCompleted: 0.80
      "[end]": 0.20
    PurchaseCompleted:
      "[end]": 1.0
