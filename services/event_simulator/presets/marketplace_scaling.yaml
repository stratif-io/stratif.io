name: Marketplace Scaling (Early Airbnb)
# Real company: Airbnb — Jan 2010 – Dec 2010 (first real growth year post-Y Combinator)
description: >
  Airbnb graduated Y Combinator in early 2010 and spent the year growing from a scrappy
  air-mattress startup to a recognized travel platform, with summer travel season and
  TechCrunch Disrupt coverage driving key growth inflections.
axes:
  growth: strong
  stickiness: normal
  engagement_depth: medium
  monetization: marketplace_fee
  virality: moderate
  scale: small
  geography: global
  anomalies: explicit
  daily_pattern: always_on
  weekly_pattern: flat
  monthly_seasonality: flat

scale_config:
  total_users: 15000
  start_date: "2010-01-01"
  end_date: "2026-04-28"

anomalies:
  - type: marketing_campaign
    name: yc_demo_day_press
    start: "2010-01-01"
    duration: 10d
    effect:
      arrivals: 2.5

  - type: marketing_campaign
    name: techcrunch_disrupt_coverage
    start: "2010-05-01"
    duration: 5d
    effect:
      arrivals: 3.0

  - type: shopping_season
    name: summer_travel_peak
    start: "2010-06-01"
    duration: 60d
    effect:
      arrivals: 1.8

  - type: marketing_campaign
    name: new_york_city_adoption_surge
    start: "2010-08-01"
    duration: 14d
    effect:
      arrivals: 2.0

markov:
  events:
    - name: PageView
    - name: Search
    - name: ListingView
    - name: MessageToSeller
    - name: Offer
    - name: Purchase
    - name: ListingCreated
    - name: ListingSold
  start:
    PageView: 0.40
    Search: 0.40
    ListingView: 0.20
  transitions:
    PageView:
      Search: 0.50
      ListingView: 0.30
      "[end]": 0.20
    Search:
      ListingView: 0.65
      "[end]": 0.35
    ListingView:
      MessageToSeller: 0.20
      Offer: 0.10
      Search: 0.35
      ListingCreated: 0.05
      "[end]": 0.30
    MessageToSeller:
      Offer: 0.30
      "[end]": 0.70
    Offer:
      Purchase: 0.40
      "[end]": 0.60
    Purchase:
      ListingSold: 0.90
      "[end]": 0.10
    ListingCreated:
      "[end]": 1.0
    ListingSold:
      "[end]": 1.0
