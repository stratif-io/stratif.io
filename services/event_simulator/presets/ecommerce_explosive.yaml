name: E-commerce Explosive Growth (Early Shopify)
# Real company: Shopify — Jan 2009 – Jun 2009 (first hyper-growth phase)
description: >
  Shopify launched in 2006 but hit its first significant growth wave in 2009 following
  a TechCrunch50 spotlight, attracting merchants looking for a simpler alternative to Magento
  and custom storefronts during the post-recession e-commerce boom.
axes:
  growth: explosive
  stickiness: sticky
  engagement_depth: medium
  monetization: subscription
  virality: moderate
  scale: small
  geography: global
  anomalies: explicit

scale_config:
  window_days: 180
  total_users: 40000
  starting_rate: 20

anomalies:
  - type: marketing_campaign
    name: techcrunch50_feature
    start: -150d  # 2009-02-01 approx — day 30, TechCrunch50 feature coverage
    duration: 7d
    effect:
      arrivals: 3.0

  - type: product_launch
    name: shopify_app_store_launch
    start: -120d  # 2009-03-03 approx — day 60, Shopify App Store opens
    duration: 5d
    effect:
      arrivals: 2.5

  - type: shopping_season
    name: holiday_merchant_signup_surge
    start: -30d   # 2009-05-31 approx — day 150, merchants sign up ahead of holiday season
    duration: 14d
    effect:
      arrivals: 2.0

markov:
  events:
    - name: Home
    - name: Search
    - name: ProductView
    - name: AddToCart
    - name: Purchase
  start:
    Home: 0.50
    Search: 0.30
    ProductView: 0.20
  transitions:
    Home:
      Search: 0.50
      ProductView: 0.30
      "[end]": 0.20
    Search:
      ProductView: 0.65
      "[end]": 0.35
    ProductView:
      AddToCart: 0.30
      Search: 0.20
      "[end]": 0.50
    AddToCart:
      Purchase: 0.60
      ProductView: 0.20
      "[end]": 0.20
    Purchase:
      "[end]": 1.0
