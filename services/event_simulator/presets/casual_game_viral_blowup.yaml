name: Casual Game Viral Blowup (Wordle-Like)
# Real company: Wordle (Josh Wardle) — Oct 2021 – Mar 2022 (launch to NYT acquisition)
description: >
  Wordle launched in October 2021 by software engineer Josh Wardle as a gift for his partner,
  then exploded virally in December 2021 when Twitter's shareable grid feature drove explosive
  word-of-mouth, culminating in the New York Times acquiring it in January 2022.
axes:
  growth: explosive
  stickiness: sticky
  engagement_depth: medium
  monetization: iap_whales
  virality: strong_viral
  scale: small
  geography: global
  anomalies: explicit

scale_config:
  window_days: 180
  total_users: 500000
  starting_rate: 100

anomalies:
  - type: marketing_campaign
    name: twitter_share_grid_viral
    start: -120d  # 2021-12-01 approx — day 60, share grid goes viral on Twitter
    duration: 10d
    effect:
      arrivals: 12.0

  - type: marketing_campaign
    name: nyt_article_coverage
    start: -105d  # 2022-01-05 approx — day 75, NYT article "Wordle Is a Love Story"
    duration: 5d
    effect:
      arrivals: 8.0

  - type: product_launch
    name: nyt_acquisition_announcement
    start: -90d   # 2022-01-31 approx — day 90, NYT acquisition announced
    duration: 3d
    effect:
      arrivals: 15.0

  - type: feature_regression
    name: post_acquisition_traffic_drop
    start: -80d   # 2022-02-10 approx — day 100, users fear paywall, traffic softens
    duration: 30d
    effect:
      arrivals: 0.6

markov:
  events:
    - name: SessionStart
    - name: DailyBonusClaimed
    - name: LevelStart
    - name: LevelComplete
    - name: LevelFail
    - name: RewardCollected
    - name: IAPOffer
    - name: IAPPurchase
    - name: AdShown
    - name: AdClicked
    - name: ShareAchievement
  start:
    SessionStart: 1.0
  transitions:
    SessionStart:
      DailyBonusClaimed: 0.55
      LevelStart: 0.20
      "[end]": 0.25
    DailyBonusClaimed:
      LevelStart: 0.85
      "[end]": 0.15
    LevelStart:
      LevelComplete: 0.60
      LevelFail: 0.35
      "[end]": 0.05
    LevelComplete:
      RewardCollected: 0.65
      LevelStart: 0.20
      IAPOffer: 0.10
      "[end]": 0.05
    LevelFail:
      LevelStart: 0.50
      AdShown: 0.20
      "[end]": 0.30
    RewardCollected:
      LevelStart: 0.55
      ShareAchievement: 0.10
      "[end]": 0.35
    IAPOffer:
      IAPPurchase: 0.40
      "[end]": 0.60
    IAPPurchase:
      ShareAchievement: 0.30
      "[end]": 0.70
    AdShown:
      AdClicked: 0.25
      LevelStart: 0.30
      "[end]": 0.45
    AdClicked:
      "[end]": 1.0
    ShareAchievement:
      "[end]": 1.0
