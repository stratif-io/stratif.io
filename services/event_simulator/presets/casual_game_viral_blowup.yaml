name: Casual Game Viral Blowup (Wordle-Like)
description: |
  Mobile casual game: ~7 weeks of quiet launch, then a TikTok/influencer
  moment creates a sharp spike and kicks off sustained exponential
  growth. Window is 6 months total so the whole arc (flat → spike →
  blade) fits inside a default 6-month dashboard chart.
axes:
  growth: hockey_stick
  stickiness: addictive
  engagement_depth: deep
  monetization: iap_whales
  virality: strong_viral
  scale: small
  geography: global
  anomalies: explicit

scale_config:
  window_days: 180
  total_users: 500000
  starting_rate: 30

growth_config:
  split_fraction: 0.28
  rate: 0.04

anomalies:
  - type: marketing_campaign
    name: viral_moment
    start: -130d
    duration: 10d
    effect:
      arrivals: 8.0
  - type: product_launch
    name: sustained_virality
    start: -120d
    duration: 120d
    effect:
      arrivals: 2.5

markov:
  events:
    - name: SessionStart
    - name: DailyBonusClaimed
    - name: LevelStart
    - name: LevelComplete
    - name: LevelFail
    - name: RewardCollected
    - name: IAPOffer
    - name: IAPPurchase
    - name: AdShown
    - name: AdClicked
    - name: ShareAchievement
  start:
    SessionStart: 1.0
  transitions:
    SessionStart:
      DailyBonusClaimed: 0.55
      LevelStart: 0.20
      "[end]": 0.25
    DailyBonusClaimed:
      LevelStart: 0.85
      "[end]": 0.15
    LevelStart:
      LevelComplete: 0.60
      LevelFail: 0.35
      "[end]": 0.05
    LevelComplete:
      RewardCollected: 0.65
      LevelStart: 0.20
      IAPOffer: 0.10
      "[end]": 0.05
    LevelFail:
      LevelStart: 0.50
      AdShown: 0.20
      "[end]": 0.30
    RewardCollected:
      LevelStart: 0.55
      ShareAchievement: 0.10
      "[end]": 0.35
    IAPOffer:
      IAPPurchase: 0.40
      "[end]": 0.60
    IAPPurchase:
      ShareAchievement: 0.30
      "[end]": 0.70
    AdShown:
      AdClicked: 0.25
      LevelStart: 0.30
      "[end]": 0.45
    AdClicked:
      "[end]": 1.0
    ShareAchievement:
      "[end]": 1.0
