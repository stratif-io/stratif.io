name: Streaming Mature (Netflix)
description: >
  Netflix's subscriber journey from 117M in January 2018 to 325M by early 2026.
  The defining events: Bird Box (Dec 2018) became the most-viewed original in 4 weeks,
  Q1 2022 saw the first subscriber loss in a decade (-200K), and the password sharing
  crackdown (May 2023) paradoxically drove +23M new subscribers in 12 months.
  Relatively flat seasonality compared to consumer apps — Q1 is strongest (winter binge),
  Q3 is weakest (outdoor summer). Weekend-heavy streaming sessions.
  Essentially zero churn: once subscribed, people stay for years.
axes:
  growth: strong
  stickiness: no_one_churns
  engagement_depth: deep
  virality: weak
  scale: large
  noise: explicit
  daily_pattern: evening_peak
  weekly_pattern: weekends_heavy
  monthly_seasonality: flat

scale_config:
  total_users: 325000000
  start_date: "2018-01-10"
  end_date: "2026-04-28"

events:
  - type: marketing_campaign
    name: bird_box_most_viewed_original_4_weeks
    start: "2018-12-21"
    duration: 30d
    effect:
      arrivals: 1.4

  - type: external_shock
    name: first_subscriber_loss_in_a_decade
    start: "2022-04-19"
    duration: 30d
    effect:
      arrivals: 0.85

  - type: product_launch
    name: password_sharing_crackdown_us_rollout
    start: "2023-05-23"
    duration: 60d
    effect:
      arrivals: 2.2

  - type: marketing_campaign
    name: squid_game_season_2_record_viewership
    start: "2024-12-26"
    duration: 30d
    effect:
      arrivals: 1.4

markov:
  events:
    - name: AppOpen
    - name: ContentBrowsed
    - name: PlaybackStarted
    - name: PlaybackCompleted
    - name: EpisodeContinued
  start:
    AppOpen: 1.0
  transitions:
    AppOpen:
      ContentBrowsed: 0.85
      "[end]": 0.15
    ContentBrowsed:
      PlaybackStarted: 0.70
      ContentBrowsed: 0.20
      "[end]": 0.10
    PlaybackStarted:
      PlaybackCompleted: 0.75
      "[end]": 0.25
    PlaybackCompleted:
      EpisodeContinued: 0.65
      ContentBrowsed: 0.25
      "[end]": 0.10
    EpisodeContinued:
      PlaybackCompleted: 0.80
      "[end]": 0.20
