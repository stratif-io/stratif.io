name: Casual Game Addictive (Candy Crush Saga)
description: >
  Candy Crush launched on Facebook in April 2012, then exploded on mobile with its November 2012
  iOS launch. It became the most-downloaded app in history, with 93M daily active users at peak.
  A textbook "hockey stick" — slow start on Facebook, then explosive mobile growth, eventually
  plateauing at a massive loyal base. Driven by extreme addictiveness (lives mechanic, social
  comparison) and near-zero off-peak churn.
axes:
  growth: hockey_stick
  stickiness: addictive
  engagement_depth: medium
  virality: moderate
  scale: large
  noise: moderate
  daily_pattern: evening_peak
  weekly_pattern: flat
  monthly_seasonality: nov_dec_peak

scale_config:
  total_users: 3000000000
  start_date: "2012-11-14"
  end_date: "2026-04-28"

events:
  - type: product_launch
    name: ios_app_store_debut
    start: "2012-11-14"
    duration: 60d
    effect:
      arrivals: 8.0

  - type: product_launch
    name: android_launch
    start: "2012-12-14"
    duration: 45d
    effect:
      arrivals: 5.0

  - type: marketing_campaign
    name: facebook_45m_users_milestone_press
    start: "2013-02-01"
    duration: 30d
    effect:
      arrivals: 2.5

  - type: marketing_campaign
    name: tv_advertising_us_primetime
    start: "2014-03-01"
    duration: 60d
    effect:
      arrivals: 1.8

  - type: marketing_campaign
    name: king_ipo_press_spike
    start: "2014-03-26"
    duration: 14d
    effect:
      arrivals: 1.5

markov:
  events:
    - name: AppOpen
    - name: ContentViewed
    - name: ActionTaken
    - name: SessionEnd
  start:
    AppOpen: 1.0
  transitions:
    AppOpen:
      ContentViewed: 0.85
      "[end]": 0.15
    ContentViewed:
      ActionTaken: 0.40
      ContentViewed: 0.30
      "[end]": 0.30
    ActionTaken:
      ContentViewed: 0.50
      "[end]": 0.50
