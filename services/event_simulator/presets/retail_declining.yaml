name: Retail Declining (Sears-Like)
# Real company: Sears Holdings — Jan 2017 – Dec 2017 (accelerating decline, 150+ store closures)
description: >
  Sears in 2017 was in accelerating decline, closing over 150 stores and posting repeated
  earnings misses; online traffic continued to erode as shoppers defected to Amazon and
  Target, with bankruptcy rumors circulating by year-end.
axes:
  growth: declining
  stickiness: normal
  engagement_depth: medium
  monetization: one_off_purchase
  virality: none
  scale: medium
  geography: us_only
  anomalies: explicit
  daily_pattern: business_hours
  weekly_pattern: weekends_heavy
  monthly_seasonality: q4_heavy

scale_config:
  window_days: 365
  total_users: 300000
  starting_rate: 1200

anomalies:
  - type: feature_regression
    name: q1_earnings_miss_store_closures
    start: "2017-02-15"
    duration: 7d
    effect:
      arrivals: 0.5

  - type: shopping_season
    name: black_friday_last_decent
    start: "2017-10-27"
    duration: 4d
    effect:
      arrivals: 2.0

  - type: feature_regression
    name: holiday_declining_vs_prior_year
    start: "2017-12-06"
    duration: 21d
    effect:
      arrivals: 0.7

  - type: feature_regression
    name: bankruptcy_rumor_leak
    start: "2017-12-21"
    duration: 5d
    effect:
      arrivals: 0.3

markov:
  events:
    - name: PageView
    - name: Search
    - name: ProductView
    - name: AddToCart
    - name: Purchase
  start:
    PageView: 0.50
    Search: 0.30
    ProductView: 0.20
  transitions:
    PageView:
      Search: 0.50
      ProductView: 0.30
      "[end]": 0.20
    Search:
      ProductView: 0.65
      "[end]": 0.35
    ProductView:
      AddToCart: 0.30
      Search: 0.20
      "[end]": 0.50
    AddToCart:
      Purchase: 0.60
      ProductView: 0.20
      "[end]": 0.20
    Purchase:
      "[end]": 1.0
