name: Retail Declining (Sears)
description: >
  Sears.com traffic declined ~60% from 2016 to 2018, mirroring the physical store collapse.
  Once America's largest retailer (ranked #5 online in 2014), Sears fell to #24 by 2018.
  Chapter 11 bankruptcy filed October 15, 2018. The digital pattern: declining baseline
  with seasonal Q4 bumps that fail to recover to prior-year levels. Each Black Friday
  brings a relative spike, but absolute numbers keep falling. Classic "declining seasonal"
  — the worst of both worlds.
axes:
  growth: declining
  stickiness: churn_heavy
  engagement_depth: shallow
  virality: none
  scale: medium
  anomalies: explicit
  daily_pattern: always_on
  weekly_pattern: flat
  monthly_seasonality: q4_heavy

scale_config:
  total_users: 50000000
  start_date: "2017-01-01"
  end_date: "2019-12-31"

events:
  - type: external_shock
    name: q1_earnings_miss_store_closure_announcements
    start: "2017-02-15"
    duration: 14d
    effect:
      arrivals: 0.6

  - type: external_shock
    name: chapter_11_bankruptcy_filing
    start: "2018-10-15"
    duration: 7d
    effect:
      arrivals: 0.4

  - type: external_shock
    name: store_closure_announcements_customer_exodus
    start: "2018-10-25"
    duration: 30d
    effect:
      arrivals: 0.6

  - type: marketing_campaign
    name: emerge_from_bankruptcy_eddie_lampert
    start: "2019-02-11"
    duration: 14d
    effect:
      arrivals: 0.8

markov:
  events:
    - name: PageView
    - name: ProductViewed
    - name: AddToCart
    - name: CheckoutStarted
    - name: PurchaseCompleted
  start:
    PageView: 1.0
  transitions:
    PageView:
      ProductViewed: 0.60
      "[end]": 0.40
    ProductViewed:
      AddToCart: 0.25
      ProductViewed: 0.35
      "[end]": 0.40
    AddToCart:
      CheckoutStarted: 0.65
      "[end]": 0.35
    CheckoutStarted:
      PurchaseCompleted: 0.80
      "[end]": 0.20
    PurchaseCompleted:
      "[end]": 1.0
