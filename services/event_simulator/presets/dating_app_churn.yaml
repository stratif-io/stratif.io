name: Dating App Churn (Tinder)
description: >
  Tinder launched at a USC college party on September 12, 2012 — 10,000 sign-ups
  in the first week. By early 2013 it had 1M MAU; by 2014, 1 billion daily swipes.
  Classic dating app dynamics: constant churn (users leave when they find partners,
  or give up), replaced by new singles. January is the biggest week of the year
  ("New Year, New Me"), September brings "cuffing season" as people seek winter partners.
  Now 530M registered users and 26M daily active users.
axes:
  growth: s_curve
  stickiness: churn_heavy
  engagement_depth: deep
  virality: moderate
  scale: large
  noise: moderate
  daily_pattern: evening_peak
  weekly_pattern: weekends_heavy
  monthly_seasonality: flat

# S-curve calibration for Tinder:
# - s_mid=0.30: peak acquisition around 2016 (day ~1500 of 4977)
# - s_sigma=0.12: narrow bell — shape ≈1× at launch, peaks 2016, fades by 2022
# - total_log=3.5: ~33× peak/baseline ratio (launch era vs growth era)
growth_config:
  s_mid: 0.30
  s_sigma: 0.12
  total_log: 3.5

scale_config:
  total_users: 530000000
  start_date: "2012-09-12"
  end_date: "2026-04-28"

events:
  - type: product_launch
    name: usc_campus_launch
    start_date: "2012-09-12"
    end_date: "2012-09-26"
    effect:
      arrivals: 5.0

  - type: product_launch
    name: app_store_public_launch
    start_date: "2012-10-01"
    end_date: "2012-10-31"
    effect:
      arrivals: 4.0

  - type: product_launch
    name: android_launch_doubles_market
    start_date: "2013-07-01"
    end_date: "2013-07-31"
    effect:
      arrivals: 2.5

  - type: marketing_campaign
    name: tinder_plus_paid_tier_launch
    start_date: "2015-03-02"
    end_date: "2015-03-16"
    effect:
      arrivals: 1.8

  - type: marketing_campaign
    name: tinder_gold_subscription
    start_date: "2017-08-01"
    end_date: "2017-08-31"
    effect:
      arrivals: 1.4

markov:
  events:
    - name: AppOpen
    - name: ContentViewed
    - name: ActionTaken
    - name: SessionEnd
  start:
    AppOpen: 1.0
  transitions:
    AppOpen:
      ContentViewed: 0.85
      "[end]": 0.15
    ContentViewed:
      ActionTaken: 0.40
      ContentViewed: 0.30
      "[end]": 0.30
    ActionTaken:
      ContentViewed: 0.50
      "[end]": 0.50
