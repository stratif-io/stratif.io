name: Dating App Churn (Tinder-Like)
# Real company: Tinder — Sep 2012 – Mar 2013 (first 6 months, USC launch to national spread)
description: >
  Tinder launched at USC in September 2012 and spread explosively campus by campus via
  word-of-mouth, with high churn as users matched (or gave up) and left.
axes:
  growth: explosive
  stickiness: churn_heavy
  engagement_depth: shallow
  monetization: subscription
  virality: moderate
  scale: small
  geography: us_only
  anomalies: explicit
  daily_pattern: evening_peak
  weekly_pattern: weekends_heavy
  monthly_seasonality: flat

scale_config:
  window_days: 180
  total_users: 25000
  starting_rate: 50

anomalies:
  - type: product_launch
    name: usc_campus_launch
    start: "2012-09-12"
    duration: 14d
    effect:
      arrivals: 3.0

  - type: marketing_campaign
    name: ucla_viral_spread
    start: "2012-10-12"
    duration: 7d
    effect:
      arrivals: 4.0

  - type: product_launch
    name: app_store_featuring
    start: "2012-11-12"
    duration: 5d
    effect:
      arrivals: 6.0

  - type: marketing_campaign
    name: valentines_day_surge
    start: "2013-02-14"
    duration: 3d
    effect:
      arrivals: 8.0

markov:
  events:
    - name: SessionStart
    - name: ProfileView
    - name: Swipe
    - name: Match
    - name: MessageSent
    - name: MessageRead
    - name: DateScheduled
    - name: SubscriptionUpgraded
  start:
    SessionStart: 1.0
  transitions:
    SessionStart:
      ProfileView: 0.55
      Swipe: 0.25
      "[end]": 0.20
    ProfileView:
      Swipe: 0.70
      "[end]": 0.30
    Swipe:
      Swipe: 0.35
      Match: 0.20
      "[end]": 0.45
    Match:
      MessageSent: 0.60
      "[end]": 0.40
    MessageSent:
      MessageRead: 0.70
      "[end]": 0.30
    MessageRead:
      MessageSent: 0.35
      DateScheduled: 0.10
      "[end]": 0.55
    DateScheduled:
      SubscriptionUpgraded: 0.20
      "[end]": 0.80
    SubscriptionUpgraded:
      "[end]": 1.0
