# Default preset — produces data qualitatively matching the pre-parametrized
# seeder. Behavior change is zero; this is the backward-compat path.

name: E-commerce Steady Growth (Amazon-Like)
# Real company: Amazon — Jan 2010 – Dec 2010 (mature steady growth phase)
description: >
  Amazon in 2010 was a mature, steadily growing e-commerce platform with Prime driving
  loyalty; growth was predictable with sharp seasonal spikes around Black Friday and
  Christmas rather than any single viral moment.

axes:
  growth: steady
  stickiness: sticky
  engagement_depth: medium
  monetization: one_off_purchase
  virality: none
  scale: medium
  geography: global
  anomalies: explicit
  daily_pattern: evening_peak
  weekly_pattern: weekends_heavy
  monthly_seasonality: q4_heavy

scale_config:
  window_days: 365
  total_users: 150000
  starting_rate: 350

anomalies:
  - type: shopping_season
    name: summer_sale_event
    start: "2010-07-01"
    duration: 7d
    effect:
      arrivals: 2.5

  - type: shopping_season
    name: black_friday
    start: "2010-10-27"
    duration: 4d
    effect:
      arrivals: 4.0

  - type: shopping_season
    name: cyber_monday
    start: "2010-10-31"
    duration: 3d
    effect:
      arrivals: 3.5

  - type: shopping_season
    name: christmas_week
    start: "2010-12-21"
    duration: 7d
    effect:
      arrivals: 2.5

markov:
  events:
    - name: Home
    - name: Search
    - name: ProductView
    - name: AddToCart
    - name: Purchase
  start:
    Home: 0.50
    Search: 0.30
    ProductView: 0.20
  transitions:
    Home:
      Search: 0.50
      ProductView: 0.30
      "[end]": 0.20
    Search:
      ProductView: 0.65
      "[end]": 0.35
    ProductView:
      AddToCart: 0.30
      Search: 0.20
      "[end]": 0.50
    AddToCart:
      Purchase: 0.60
      ProductView: 0.20
      "[end]": 0.20
    Purchase:
      "[end]": 1.0
