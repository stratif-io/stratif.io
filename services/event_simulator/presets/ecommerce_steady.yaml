name: E-commerce Steady Growth (Amazon Prime, 2010-2015)
description: >
  Amazon's growth from 88 million active customers in 2010 to 285 million by 2015,
  driven by Prime expansion, Kindle Fire hardware, and Prime Instant Video. This period
  saw Amazon transition from a retailer to a platform. Extreme Q4 seasonality —
  approximately 35% of annual GMV comes in Q4. Prime members essentially never churn
  (retention >90% annually). The Prime Day launch in July 2015 created a new
  artificial summer peak.
axes:
  growth: strong
  stickiness: no_one_churns
  engagement_depth: medium
  virality: weak
  scale: large
  noise: moderate
  daily_pattern: always_on
  weekly_pattern: flat
  monthly_seasonality: flat

scale_config:
  total_users: 285000000
  start_date: "2010-01-01"
  end_date: "2015-12-31"

events:
  - type: product_launch
    name: prime_instant_video_launch
    start: "2011-02-22"
    duration: 30d
    effect:
      arrivals: 1.6

  - type: product_launch
    name: kindle_fire_launch_drives_prime
    start: "2011-11-15"
    duration: 30d
    effect:
      arrivals: 1.8

  - type: marketing_campaign
    name: prime_10m_members_milestone
    start: "2013-01-01"
    duration: 30d
    effect:
      arrivals: 1.3

  - type: marketing_campaign
    name: prime_53pct_yoy_growth_disclosed
    start: "2014-04-10"
    duration: 14d
    effect:
      arrivals: 1.4

  - type: product_launch
    name: first_prime_day_new_summer_holiday
    start: "2015-07-15"
    duration: 2d
    effect:
      arrivals: 3.0

markov:
  events:
    - name: PageView
    - name: ProductViewed
    - name: AddToCart
    - name: CheckoutStarted
    - name: PurchaseCompleted
  start:
    PageView: 1.0
  transitions:
    PageView:
      ProductViewed: 0.60
      "[end]": 0.40
    ProductViewed:
      AddToCart: 0.25
      ProductViewed: 0.35
      "[end]": 0.40
    AddToCart:
      CheckoutStarted: 0.65
      "[end]": 0.35
    CheckoutStarted:
      PurchaseCompleted: 0.80
      "[end]": 0.20
    PurchaseCompleted:
      "[end]": 1.0
