# Default preset — produces data qualitatively matching the pre-parametrized
# seeder. Behavior change is zero; this is the backward-compat path.

name: E-commerce Steady Growth (Amazon-Like)
# Real company: Amazon — Jan 2010 – Dec 2010 (mature steady growth phase)
description: >
  Amazon in 2010 was a mature, steadily growing e-commerce platform with Prime driving
  loyalty; growth was predictable with sharp seasonal spikes around Black Friday and
  Christmas rather than any single viral moment.

axes:
  growth: steady
  stickiness: sticky
  engagement_depth: medium
  monetization: one_off_purchase
  virality: none
  scale: medium
  geography: global
  anomalies: explicit

scale_config:
  window_days: 365
  total_users: 150000
  starting_rate: 350

anomalies:
  - type: shopping_season
    name: summer_sale_event
    start: -185d  # 2010-07-01 approx — day 180, summer promotion event
    duration: 7d
    effect:
      arrivals: 2.5

  - type: shopping_season
    name: black_friday
    start: -65d   # 2010-10-27 approx — day 300, Black Friday
    duration: 4d
    effect:
      arrivals: 4.0

  - type: shopping_season
    name: cyber_monday
    start: -61d   # 2010-10-31 approx — day 304, Cyber Monday
    duration: 3d
    effect:
      arrivals: 3.5

  - type: shopping_season
    name: christmas_week
    start: -10d   # 2010-12-21 approx — day 355, Christmas week
    duration: 7d
    effect:
      arrivals: 2.5

markov:
  events:
    - name: Home
    - name: Search
    - name: ProductView
    - name: AddToCart
    - name: Purchase
  start:
    Home: 0.50
    Search: 0.30
    ProductView: 0.20
  transitions:
    Home:
      Search: 0.50
      ProductView: 0.30
      "[end]": 0.20
    Search:
      ProductView: 0.65
      "[end]": 0.35
    ProductView:
      AddToCart: 0.30
      Search: 0.20
      "[end]": 0.50
    AddToCart:
      Purchase: 0.60
      ProductView: 0.20
      "[end]": 0.20
    Purchase:
      "[end]": 1.0
