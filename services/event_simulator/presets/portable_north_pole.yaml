name: Holiday Seasonal App (Portable North Pole)
description: >
  Portable North Pole launched in November 2009 — the world's most seasonally extreme app.
  Parents use it to create personalized Santa video messages for their children, so virtually
  100% of usage falls in a 6-week window from mid-November to December 25. January through
  October is near-zero. Built by Francois Dorion in Montreal, it reached 5M+ downloads
  by 2013 and 250,000 unique sessions per day at its December 2018 peak. Classic one-shot
  usage: parents come back each year but don't engage outside the holiday window.
axes:
  growth: strong
  stickiness: one_shot
  engagement_depth: shallow
  virality: strong_viral
  scale: small
  anomalies: explicit
  daily_pattern: evening_peak
  weekly_pattern: flat
  monthly_seasonality: nov_dec_peak

scale_config:
  total_users: 35000000
  start_date: "2009-11-01"
  end_date: "2026-04-28"

anomalies:
  - type: product_launch
    name: initial_launch_app_store_featured
    start: "2009-11-01"
    duration: 60d
    effect:
      arrivals: 5.0

  - type: marketing_campaign
    name: five_million_downloads_milestone
    start: "2013-12-01"
    duration: 30d
    effect:
      arrivals: 2.0

  - type: marketing_campaign
    name: nativescript_rebuild_250k_peak_day
    start: "2018-11-15"
    duration: 45d
    effect:
      arrivals: 1.5

  - type: marketing_campaign
    name: unicef_partnership_launch
    start: "2020-11-01"
    duration: 30d
    effect:
      arrivals: 1.4

