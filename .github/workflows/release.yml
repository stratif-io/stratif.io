name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  packages: write
  actions: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          target-branch: main
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # When release_created=false: release-please created a version bump PR on main.
  # We refresh uv.lock inside the PR branch (release-please bumps pyproject.toml
  # without touching uv.lock), then merge it. The PR merge triggers a new push
  # event on main, which kicks off run 2 where release_created=true.
  auto-merge-release-pr:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Refresh uv.lock and merge version bump PR
        run: |
          PR_NUMBER=$(gh pr list \
            --base main \
            --json number,headRefName \
            --jq '[.[] | select(.headRefName | startswith("release-please--"))] | .[0].number // empty')

          if [ -z "$PR_NUMBER" ]; then
            echo "No pending release-please PR — no unreleased commits. Done."
            exit 0
          fi

          # Refresh uv.lock in the PR branch before merging so the lockfile
          # stays in sync with the bumped pyproject.toml version.
          PR_BRANCH=$(gh pr view "$PR_NUMBER" --json headRefName --jq '.headRefName')
          git fetch origin "$PR_BRANCH"
          git checkout "$PR_BRANCH"
          uv lock
          if ! git diff --quiet uv.lock; then
            git add uv.lock
            git commit -m "chore: refresh uv.lock for version bump [skip ci]"
            git push origin "$PR_BRANCH"
          fi

          # Wait for GitHub to compute mergeability after the push, then merge.
          # NOTE: gh pr merge with GITHUB_TOKEN does NOT trigger a new push event
          # (GitHub suppresses all workflow triggers from GITHUB_TOKEN to prevent
          # infinite loops). We fire workflow_dispatch explicitly instead.
          sleep 10
          gh pr merge "$PR_NUMBER" --merge --admin
          gh workflow run release.yml --ref main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-frontend:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Build frontend
        run: bun run build
        working-directory: apps/analytics

      - name: Package frontend
        run: tar -czf frontend.tar.gz -C apps/analytics dist

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.release-please.outputs.tag_name }}
          files: frontend.tar.gz

  build-docker:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/stratif-io/stratif.io:${{ needs.release-please.outputs.tag_name }}
            ghcr.io/stratif-io/stratif.io:latest

  publish-npm:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install
        working-directory: apps/analytics

      # npm ignores apps/analytics/.npmrc in workspace mode (root package.json has
      # "workspaces": ["apps/*"]). Write auth to the user-level npmrc instead —
      # that always takes precedence regardless of workspace context.
      - name: Publish to GitHub Packages
        run: |
          echo "//npm.pkg.github.com/:_authToken=${STRATIFIO_OSS_TOKEN}" >> ~/.npmrc
          npm publish --access public
        working-directory: apps/analytics
        env:
          STRATIFIO_OSS_TOKEN: ${{ secrets.STRATIFIO_OSS_TOKEN }}

  # After a release, open a PR to sync the version bump and uv.lock back into
  # develop so it stays up to date with main.
  sync-develop:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Open sync PR (main → develop)
        run: |
          OUTPUT=$(gh pr create \
            --title "chore: sync main → develop after ${{ needs.release-please.outputs.tag_name }}" \
            --body "Version bump and uv.lock from the ${{ needs.release-please.outputs.tag_name }} release. Merge to keep develop in sync with main." \
            --base develop \
            --head main 2>&1) && echo "$OUTPUT" || {
            if echo "$OUTPUT" | grep -q "No commits between"; then
              echo "develop and main are identical — no sync PR needed."
            elif echo "$OUTPUT" | grep -qiE "already exists|A pull request for"; then
              echo "Sync PR already exists — skipping."
            else
              echo "$OUTPUT"
              exit 1
            fi
          }
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
