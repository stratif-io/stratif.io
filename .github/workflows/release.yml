name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  packages: write
  actions: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json


  build-frontend:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Build frontend
        run: bun run build
        working-directory: apps/web

      - name: Package frontend
        run: tar -czf frontend.tar.gz -C apps/web dist

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.release-please.outputs.tag_name }}
          files: frontend.tar.gz

  build-docker:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/stratif-io/stratif.io:${{ needs.release-please.outputs.tag_name }}
            ghcr.io/stratif-io/stratif.io:latest

  publish-npm:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install
        working-directory: apps/web

      # npm ignores apps/web/.npmrc in workspace mode (root package.json has
      # "workspaces": ["apps/*"]). Write auth to the user-level npmrc instead —
      # that always takes precedence regardless of workspace context.
      - name: Publish to GitHub Packages
        run: |
          echo "//npm.pkg.github.com/:_authToken=${STRATIFIO_OSS_TOKEN}" >> ~/.npmrc
          npm publish --access public
        working-directory: apps/web
        env:
          STRATIFIO_OSS_TOKEN: ${{ secrets.STRATIFIO_OSS_TOKEN }}

  sync-develop:
    needs: release-please
    if: always() && needs.release-please.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # When release_created=false: release-please created a version bump PR on
      # develop (the repo default branch). We refresh uv.lock inside the PR branch
      # (release-please bumps pyproject.toml without touching uv.lock), then
      # auto-merge to develop, then push develop→main.
      # The resulting push to main triggers a second run where release_created=true.
      # No direct commits to main means develop and main stay in sync — no divergence.
      - name: Merge version bump PR and push to main
        if: ${{ needs.release-please.outputs.release_created != 'true' }}
        run: |
          PR_NUMBER=$(gh pr list \
            --base develop \
            --json number,headRefName \
            --jq '[.[] | select(.headRefName | startswith("release-please--"))] | .[0].number // empty')

          if [ -z "$PR_NUMBER" ]; then
            echo "No pending release-please PR — no unreleased feat/fix commits. Done."
            exit 0
          fi

          # Refresh uv.lock in the PR branch before merging so no extra commit
          # is needed on main or develop after the fact.
          PR_BRANCH=$(gh pr view "$PR_NUMBER" --json headRefName --jq '.headRefName')
          git fetch origin "$PR_BRANCH"
          git checkout "$PR_BRANCH"
          uv lock
          if ! git diff --quiet uv.lock; then
            git add uv.lock
            git commit -m "chore: refresh uv.lock for version bump [skip ci]"
            git push origin "$PR_BRANCH"
          fi

          # Merge to develop. Wait for GitHub to compute mergeability first.
          sleep 10
          gh pr merge "$PR_NUMBER" --merge --admin

          # Push develop→main so main has the version bump.
          # NOTE: GITHUB_TOKEN pushes do NOT trigger new workflow runs (GitHub
          # suppresses push events from GITHUB_TOKEN to prevent infinite loops).
          # After pushing, we trigger the release workflow explicitly via
          # workflow_dispatch, which GITHUB_TOKEN IS allowed to fire.
          git fetch origin develop
          git push origin origin/develop:main
          gh workflow run release.yml --ref main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # When release_created=true: all assets are being built in parallel jobs.
      # develop and main are already in sync (version bump + uv.lock came through
      # the auto-merged PR). Nothing more to do.
      - name: Confirm release
        if: ${{ needs.release-please.outputs.release_created == 'true' }}
        run: |
          echo "✓ Release ${{ needs.release-please.outputs.tag_name }} created."
          echo "  develop and main are in sync — no further sync needed."
