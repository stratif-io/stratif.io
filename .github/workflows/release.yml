name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  packages: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          target-branch: main
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build-frontend:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Build frontend
        run: bun run build
        working-directory: apps/web

      - name: Package frontend
        run: tar -czf frontend.tar.gz -C apps/web dist

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.release-please.outputs.tag_name }}
          files: frontend.tar.gz

  build-docker:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/stratif-io/stratif.io:${{ needs.release-please.outputs.tag_name }}
            ghcr.io/stratif-io/stratif.io:latest

  publish-npm:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install
        working-directory: apps/web

      # npm ignores apps/web/.npmrc in workspace mode (root package.json has
      # "workspaces": ["apps/*"]). Write auth to the user-level npmrc instead —
      # that always takes precedence regardless of workspace context.
      - name: Publish to GitHub Packages
        run: |
          echo "//npm.pkg.github.com/:_authToken=${STRATIFIO_OSS_TOKEN}" >> ~/.npmrc
          npm publish --access public
        working-directory: apps/web
        env:
          STRATIFIO_OSS_TOKEN: ${{ secrets.STRATIFIO_OSS_TOKEN }}

  sync-develop:
    needs: release-please
    if: always() && needs.release-please.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # When release_created=false: release-please created/updated a version bump
      # PR targeting main. Auto-merge it — the resulting push to main triggers a
      # new workflow run where release-please will see the bumped version and set
      # release_created=true, firing the actual release.
      - name: Auto-merge release-please PR into main
        if: ${{ needs.release-please.outputs.release_created != 'true' }}
        run: |
          PR_NUMBER=$(gh pr list \
            --base main \
            --label "autorelease: pending" \
            --json number,headRefName \
            --jq '[.[] | select(.headRefName | startswith("release-please--"))] | .[0].number // empty')

          if [ -z "$PR_NUMBER" ]; then
            echo "No pending release-please PR on main — no unreleased feat/fix commits. Done."
            exit 0
          fi

          echo "Merging release-please PR #${PR_NUMBER} into main…"
          gh pr merge "$PR_NUMBER" --merge --admin
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # When release_created=true: the GitHub release is live. Refresh uv.lock on
      # main (release-please bumps pyproject.toml without regenerating it), then
      # open a sync PR so the version bump flows back into develop.
      - name: Install uv
        if: ${{ needs.release-please.outputs.release_created == 'true' }}
        uses: astral-sh/setup-uv@v5

      - name: Refresh uv.lock (if pyproject.toml was bumped)
        if: ${{ needs.release-please.outputs.release_created == 'true' }}
        run: |
          uv lock
          if ! git diff --quiet uv.lock; then
            git add uv.lock
            git commit -m "chore: refresh uv.lock after release [skip ci]"
            git push origin main
          fi

      - name: Open sync PR (main → develop)
        if: ${{ needs.release-please.outputs.release_created == 'true' }}
        run: |
          OUTPUT=$(gh pr create \
            --title "chore: sync main → develop after release" \
            --body "Automated PR to sync version bump and changelog from main back into develop." \
            --base develop \
            --head main 2>&1) && echo "$OUTPUT" || {
            if echo "$OUTPUT" | grep -q "No commits between"; then
              echo "develop and main are identical — no sync PR needed."
            elif echo "$OUTPUT" | grep -qiE "already exists|A pull request for"; then
              echo "Sync PR already exists — skipping."
            else
              echo "$OUTPUT"
              exit 1
            fi
          }
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
