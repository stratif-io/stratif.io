name: Sync develop from main

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Open sync PR
        uses: repo-sync/pull-request@v2
        with:
          source_branch: main
          destination_branch: develop
          pr_title: "chore: sync main → develop after release"
          pr_body: "Automated PR to sync version bump and changelog from main back into develop."
          github_token: ${{ secrets.GITHUB_TOKEN }}
