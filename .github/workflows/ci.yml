name: CI

on:
  pull_request:

jobs:
  frontend-checks:
    name: Frontend checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Format check
        run: bun run format:check

      - name: Build (TypeScript typecheck + bundle)
        run: bun run build

      - name: Unit tests
        run: bun run test:run

  backend-unit:
    name: Backend unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync

      - name: Run unit tests
        run: uv run pytest --ignore=backend/tests/e2e -m "not integration and not e2e" -v

  backend-integration:
    name: Backend integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync

      # DB credential secrets will be added here as env vars when credentials are defined
      - name: Run integration tests
        run: uv run pytest --ignore=backend/tests/e2e -m integration -v

  backend-e2e:
    name: Backend E2E tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync

      - name: Write connections.yaml from secret
        run: echo "$CONNECTIONS_YAML" > connections.yaml
        env:
          CONNECTIONS_YAML: ${{ secrets.CONNECTIONS_YAML }}

      - name: Run backend E2E tests
        run: uv run pytest -m e2e -v

  playwright-e2e:
    name: Playwright E2E tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install backend dependencies
        run: uv sync

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps
        working-directory: apps/web

      - name: Start backend
        run: uv run serve &
        env:
          STRATIFIO_ENCRYPTION_KEY: ${{ secrets.CI_ENCRYPTION_KEY }}

      - name: Wait for backend to be ready
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/api/health && exit 0
            sleep 1
          done
          echo "Backend did not become ready in time" >&2
          exit 1

      - name: Run Playwright tests
        run: bun run test:e2e
        env:
          CI: true
