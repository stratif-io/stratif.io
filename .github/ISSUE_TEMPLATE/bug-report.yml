name: Bug report
description: Something isn't working as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please fill in as much detail as you can.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: How do we reproduce this?
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
      description: What did you expect to happen?
    validations:
      required: true

  - type: dropdown
    id: warehouse
    attributes:
      label: Warehouse / database
      options:
        - Not applicable
        - DuckDB
        - PostgreSQL
        - ClickHouse
        - Snowflake
        - Databricks
        - SQLite
        - Other
    validations:
      required: false

  - type: input
    id: version
    attributes:
      label: stratif.io version
      placeholder: e.g. 0.21.12 — check the footer or `docker image ls`
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or error output
      render: shell
    validations:
      required: false
