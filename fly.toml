# fly.toml app configuration file generated for openflow-analytics on 2026-03-06T18:36:05+01:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'openflow-analytics'
primary_region = 'iad'

[build]
  dockerfile = 'Dockerfile'

[env]
  OPENFLOW_DEBUG = 'false'
  OPENFLOW_JWT_ALGORITHM = 'HS256'
  OPENFLOW_JWT_EXPIRE_DAYS = '7'
  OPENFLOW_LOG_FORMAT = 'json'
  OPENFLOW_LOG_LEVEL = 'INFO'
  OPENFLOW_LOG_SQL = 'false'
  PORT = '8000'

[[mounts]]
  source = 'openflow_data'
  destination = '/data'

[[services]]
  protocol = 'tcp'
  internal_port = 8000

  [[services.ports]]
    port = 443
    handlers = ['tls', 'http']

  [[services.ports]]
    port = 80
    handlers = ['http']
    force_https = true

  [services.concurrency]
    type = 'requests'
    hard_limit = 50
    soft_limit = 25

  [[services.http_checks]]
    interval = '15s'
    timeout = '10s'
    grace_period = '20s'
    path = '/api/health'

[[vm]]
  memory = '1gb'
  cpus = 1
  memory_mb = 1024
