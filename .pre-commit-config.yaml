repos:
  - repo: local
    hooks:
      - id: uv-lock
        name: uv.lock up to date
        entry: uv lock
        language: system
        files: ^pyproject\.toml$
        pass_filenames: false

      - id: ty
        name: ty (type check)
        entry: uv run ty check .
        language: system
        types: [python]
        pass_filenames: false

      - id: saas-contract-check
        name: SaaS contract check (tsc + vite build)
        entry: bash -c "cd ../stratifio-saas && npm run build"
        language: system
        files: ^frontend/
        pass_filenames: false

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.2
    hooks:
      - id: ruff
        name: ruff (lint + fix)
        args: [--fix]
      - id: ruff-format
        name: ruff (format)
