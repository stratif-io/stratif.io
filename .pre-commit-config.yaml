repos:
  - repo: local
    hooks:
      - id: uv-lock-check
        name: uv.lock up to date
        entry: uv lock --check
        language: system
        files: ^(pyproject\.toml|uv\.lock)$
        pass_filenames: false

      - id: ruff-lint
        name: ruff (lint)
        entry: uv run ruff check .
        language: system
        types: [python]
        pass_filenames: false

      - id: ruff-format
        name: ruff (format)
        entry: uv run ruff format --check .
        language: system
        types: [python]
        pass_filenames: false 

      - id: ty
        name: ty (type check)
        entry: uv run ty check .
        language: system
        types: [python]
        pass_filenames: false

      - id: saas-contract-check
        name: SaaS contract check (tsc + vite build)
        entry: bash -c "cd ../stratifio-saas && npm run build"
        language: system
        files: ^frontend/
        pass_filenames: false
