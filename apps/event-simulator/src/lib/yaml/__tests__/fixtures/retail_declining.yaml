name: retail_declining
description: Brick-and-mortar + web retail losing market share.
axes:
  growth: declining
  stickiness: normal
  engagement_depth: medium
  monetization: one_off_purchase
  virality: none
  scale: medium
  geography: us_only
scale_config:
  start_date: "2023-01-01"
  end_date: "2024-07-25"
events:
  - type: shopping_season
    name: black_friday_peak
    start_date: "2023-01-01"
    end_date: "2023-01-04"
    effect:
      arrivals: 3.5
  - type: outage
    name: server_downtime
    start_date: "2023-05-21"
    end_date: "2023-05-22"
    effect:
      all_events: 0.0
markov:
  events:
    - name: PageView
    - name: Search
    - name: ProductView
    - name: AddToCart
    - name: Purchase
  start:
    PageView: 0.50
    Search: 0.30
    ProductView: 0.20
  transitions:
    PageView:
      Search: 0.50
      ProductView: 0.30
      "[end]": 0.20
    Search:
      ProductView: 0.65
      "[end]": 0.35
    ProductView:
      AddToCart: 0.30
      Search: 0.20
      "[end]": 0.50
    AddToCart:
      Purchase: 0.60
      ProductView: 0.20
      "[end]": 0.20
    Purchase:
      "[end]": 1.0
