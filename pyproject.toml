[project]
name = "stratifio-core"
version = "0.1.0"
description = "stratif.io Analytics — open source self-hostable analytics dashboard backend"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.104.0",
    "duckdb>=0.9.0",
    "faker>=20.0.0",
    "uvicorn[standard]>=0.24.0",
    "sqlglot>=28.0.0",
    "pydantic-settings>=2.0.0",
    "pandas>=2.0.0",
    "pyarrow>=14.0.0",
    "cryptography>=41.0.0",
    "python-multipart>=0.0.6",
    "httpx>=0.27.0",
    "structlog>=24.0.0",
    "starlette>=0.52.1",
    "pydantic>=2.12.5",
    "databricks-sql-connector>=4.2.5",
    "psycopg2-binary>=2.9.11",
]

[project.optional-dependencies]
snowflake = ["snowflake-connector-python>=3.0.0"]
clickhouse = ["clickhouse-connect>=0.7.0"]

[project.scripts]
serve = "backend.main:main"
seed-duckdb = "seeders.seeder_duckdb:main"
seed-sqlite = "seeders.seeder_sqlite:main"
seed-postgres = "seeders.seeder_postgresql:main"
seed-clickhouse = "seeders.seeder_clickhouse:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend", "seeders"]

[tool.hatch.build.targets.sdist]
exclude = ["db/"]

[dependency-groups]
dev = [
    "pre-commit>=4.3.0",
    "pytest>=8.4.2",
    "ruff>=0.15.2",
    "ty>=0.0.17",
    "testcontainers[clickhouse,postgres]>=4.8",
    "fakesnow>=0.9.0",
]

[tool.ruff]
target-version = "py311"  # Your Python version
line-length = 88

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings  
    "F",   # Pyflakes (unused imports, undefined names)
    "I",   # isort (import sorting)
    "UP",  # pyupgrade (modern Python syntax)
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]
ignore = ["E501"]  # Line too long (handled by formatter)

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

