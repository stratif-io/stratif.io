[project]
name = "openflow-analytics"
version = "1.0.0"
description = "Bare Metal Product Analytics POC"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.104.0",
    "duckdb>=0.9.0",
    "faker>=20.0.0",
    "uvicorn[standard]>=0.24.0",
    "sqlglot>=28.0.0",
    "pydantic-settings>=2.0.0",
    "pandas>=2.0.0",
    "pyarrow>=14.0.0",
]

[project.scripts]
serve = "openflow.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["openflow"]
