[project]
name = "openflow-analytics"
version = "1.0.0"
description = "Bare Metal Product Analytics POC"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.104.0",
    "duckdb>=0.9.0",
    "faker>=20.0.0",
    "uvicorn[standard]>=0.24.0",
    "sqlglot>=28.0.0",
    "pydantic-settings>=2.0.0",
    "pandas>=2.0.0",
    "pyarrow>=14.0.0",
    "cryptography>=41.0.0",
    "bcrypt>=4.0.0",
    "python-jose[cryptography]>=3.3.0",
    "python-multipart>=0.0.6",
    "httpx>=0.27.0",
    "itsdangerous>=2.2.0",
    "structlog>=24.0.0",
    "behave>=1.3.3",
    "starlette>=0.52.1",
    "pydantic>=2.12.5",
    "databricks-sql-connector>=4.2.5",
    "psycopg2>=2.9.11",
    "slowapi>=0.1.9",
]

[project.scripts]
serve = "openflow.main:main"
seed-duckdb = "seeders.seeder_duckdb:main"
seed-sqlite = "seeders.seeder_sqlite:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["openflow", "seeders"]

[tool.hatch.build.targets.sdist]
exclude = ["db/"]

[dependency-groups]
dev = [
    "pre-commit>=4.3.0",
    "pytest>=8.4.2",
    "ruff>=0.15.2",
    "ty>=0.0.17",
]

[tool.ruff]
target-version = "py311"  # Your Python version
line-length = 88

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings  
    "F",   # Pyflakes (unused imports, undefined names)
    "I",   # isort (import sorting)
    "UP",  # pyupgrade (modern Python syntax)
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]
ignore = ["E501"]  # Line too long (handled by formatter)

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

